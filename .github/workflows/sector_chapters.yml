name: Sector Chapters

on:
  schedule:
    - cron: '0 6 * * 6'  # Saturdays 6am UTC — after full week of earnings are scraped, synthesized, and sorted
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing sector chapter files'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --local user.email "alberto.boquin@gmail.com"
          git config --local user.name "Alberto Jose Boquin"

      - name: Generate sector chapters
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python scripts/generate_sector_chapters.py
